<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נקודות חיבור - פורטל רספונסיבי</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="help-tooltips.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Heebo:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="sidebar" data-sidebar></aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1 class="title-with-help">
                        שלום, מתנדב!
                        <button type="button" class="help-icon" data-tooltip="זהו מסך הבית שמרכז נתוני פעילות ופעולות מהירות." aria-label="מידע נוסף">?</button>
                    </h1>
                    <p>שמחים שחזרת לעזור היום. מכאן אפשר לדווח על צורך חדש או לעקוב אחרי דיווחים קיימים.</p>
                </div>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Volunteer&background=f1a340&color=fff" alt="User">
                </div>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon orange-bg"><i class="fa-solid fa-house-chimney"></i></div>
                    <div class="stat-info">
                        <h3>1</h3>
                        <p class="label-with-help">קשישים בקשר <button type="button" class="help-icon" data-tooltip="מספר הקשישים שנמצאים במעקב פעיל כרגע." aria-label="מידע נוסף">?</button></p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blue-bg"><i class="fa-solid fa-clipboard-list"></i></div>
                    <div class="stat-info">
                        <h3>12</h3>
                        <p class="label-with-help">סה"כ דיווחים <button type="button" class="help-icon" data-tooltip="כל הפניות שנשלחו למערכת ונשמרו למעקב." aria-label="מידע נוסף">?</button></p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green-bg"><i class="fa-solid fa-check-double"></i></div>
                    <div class="stat-info">
                        <h3>8</h3>
                        <p>בקשות שנסגרו</p>
                    </div>
                </div>
            </section>

            <section class="quick-actions">
                <div class="action-header">
                    <h2 class="section-title-with-help"><i class="fa-solid fa-bolt"></i> פעולות מהירות <button type="button" class="help-icon" data-tooltip="קיצורים לפעולות המרכזיות שהמתנדב מבצע במערכת." aria-label="מידע נוסף">?</button></h2>
                </div>
                <div class="action-buttons">
                    <a href="chatbot.html" class="big-action-btn primary">
                        <div class="btn-content">
                            <i class="fa-solid fa-plus-circle"></i>
                            <div>
                                <strong>דיווח על צורך חדש</strong>
                                <span>עדכן מה קורה בשטח</span>
                            </div>
                        </div>
                    </a>
                    <a href="reports.html" class="big-action-btn secondary">
                        <div class="btn-content">
                            <i class="fa-solid fa-history"></i>
                            <div>
                                <strong>דיווחים קודמים</strong>
                                <span>עקוב אחר הטיפול</span>
                            </div>
                        </div>
                    </a>
                </div>
            </section>
        </main>

        <nav class="mobile-nav" data-mobile-nav></nav>
    </div>

    <script src="sidebar.js"></script>
    <script src="help-tooltips.js"></script>
</body>
</html>
