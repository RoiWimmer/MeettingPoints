<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>נקודות חיבור - פרופיל</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="help-tooltips.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-layout {
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            gap: 20px;
            align-items: start;
        }

        .profile-card,
        .info-card {
            background: white;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        .profile-card {
            text-align: center;
        }

        .avatar {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f1a340, #ff7e5f);
            color: white;
            font-size: 2rem;
            font-weight: 800;
            box-shadow: 0 12px 24px rgba(241, 163, 64, 0.22);
        }

        .profile-card h2,
        .info-card h2 {
            margin: 0 0 10px;
            color: var(--dark-blue);
        }

        .role-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 7px 12px;
            background: #fff7ed;
            color: var(--primary-orange);
            font-weight: 800;
        }

        .detail-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .detail-row:last-child {
            border-bottom: 0;
        }

        .detail-label {
            color: var(--text-muted);
            font-weight: 700;
        }

        .detail-value {
            color: var(--dark-blue);
            font-weight: 800;
            text-align: left;
        }

        .settings-list {
            display: grid;
            gap: 12px;
        }

        .profile-form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .profile-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .profile-field.full {
            grid-column: 1 / -1;
        }

        .profile-field label {
            color: var(--text-muted);
            font-weight: 800;
        }

        .profile-field input {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 11px 12px;
            font-size: 1rem;
            outline: none;
            color: var(--dark-blue);
            background: white;
        }

        .profile-field input:focus {
            border-color: rgba(241, 163, 64, 0.7);
            box-shadow: 0 0 0 4px rgba(241, 163, 64, 0.12);
        }

        .readonly-pill {
            border: 1px solid #fed7aa;
            border-radius: 12px;
            padding: 11px 12px;
            background: #fff7ed;
            color: var(--primary-orange);
            font-weight: 800;
        }

        .profile-actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
            margin-top: 6px;
        }

        .profile-btn {
            border: 0;
            border-radius: 12px;
            padding: 11px 18px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .profile-btn.primary {
            background: var(--primary-orange);
            color: white;
        }

        .profile-btn.secondary {
            background: #fff7ed;
            color: var(--primary-orange);
            border: 1px solid #fed7aa;
        }

        .profile-message {
            display: none;
            grid-column: 1 / -1;
            border-radius: 14px;
            padding: 12px 14px;
            font-weight: 800;
        }

        .profile-message.active {
            display: block;
        }

        .profile-message.success {
            color: #059669;
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
        }

        .profile-message.error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .setting-toggle {
            width: 44px;
            height: 24px;
            accent-color: var(--primary-orange);
            cursor: pointer;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #f8fafc;
            border-radius: 14px;
            padding: 14px;
        }

        .setting-item strong {
            display: block;
            color: var(--dark-blue);
            margin-bottom: 3px;
        }

        .setting-item span {
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        .status-badge {
            color: #059669;
            background: #ecfdf5;
            border-radius: 999px;
            padding: 6px 10px;
            font-weight: 800;
            white-space: nowrap;
        }

        @media (max-width: 900px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }

            .profile-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar" data-sidebar></aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h1 class="title-with-help">
                        פרופיל
                        <button type="button" class="help-icon" data-tooltip="כאן מוצגים פרטי המשתמש, סוג החשבון והעדפות בסיסיות." aria-label="מידע נוסף">?</button>
                    </h1>
                    <p>פרטי המשתמש והגדרות החשבון שלך במערכת.</p>
                </div>
            </header>

            <section class="profile-layout">
                <aside class="profile-card">
                    <div class="avatar" id="profileAvatar">מ</div>
                    <h2 id="profileName">טוען...</h2>
                    <span class="role-pill"><i class="fa-solid fa-id-badge"></i> <span id="profileRolePill">משתמש</span></span>
                    <div class="detail-list">
                        <div class="detail-row">
                            <span class="detail-label">סוג חשבון</span>
                            <span class="detail-value" id="profileRole">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">אזור פעילות</span>
                            <span class="detail-value" id="profileAreaSummary">-</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">עמותה</span>
                            <span class="detail-value" id="profileOrg">-</span>
                        </div>
                    </div>
                </aside>

                <section class="info-card">
                    <h2 class="section-title-with-help">פרטי קשר <button type="button" class="help-icon" data-tooltip="פרטים שבעזרתם הרכזים והעמותה יכולים ליצור קשר עם המשתמש." aria-label="מידע נוסף">?</button></h2>
                    <form class="profile-form" id="profileForm">
                        <div class="profile-message" id="profileMessage"></div>

                        <div class="profile-field">
                            <label for="fullName">שם מלא</label>
                            <input type="text" id="fullName" autocomplete="name" required>
                        </div>

                        <div class="profile-field">
                            <label for="phone">טלפון</label>
                            <input type="tel" id="phone" autocomplete="tel" placeholder="050-123-4567">
                        </div>

                        <div class="profile-field">
                            <label for="email">אימייל</label>
                            <input type="email" id="email" autocomplete="email" required>
                        </div>

                        <div class="profile-field">
                            <label for="area">אזור פעילות</label>
                            <input type="text" id="area" placeholder="לדוגמה: חולון ובת ים">
                        </div>

                        <div class="profile-field">
                            <label>סוג חשבון</label>
                            <div class="readonly-pill" id="roleReadonly">-</div>
                        </div>

                        <div class="profile-field">
                            <label>עמותה</label>
                            <div class="readonly-pill" id="organizationReadonly">-</div>
                        </div>

                        <div class="profile-field">
                            <label for="oldPassword">סיסמה נוכחית</label>
                            <input type="password" id="oldPassword" autocomplete="current-password">
                        </div>

                        <div class="profile-field">
                            <label for="newPassword">סיסמה חדשה</label>
                            <input type="password" id="newPassword" autocomplete="new-password" placeholder="לפחות 8 תווים">
                        </div>

                        <div class="profile-actions">
                            <button type="submit" class="profile-btn primary"><i class="fa-solid fa-floppy-disk"></i> שמירת שינויים</button>
                            <button type="button" class="profile-btn secondary" onclick="loadProfile()"><i class="fa-solid fa-rotate-right"></i> רענון</button>
                        </div>
                    </form>

                    <h2 style="margin-top:28px;">הגדרות ומידע</h2>
                    <div class="settings-list">
                        <div class="setting-item">
                            <div>
                                <strong>התראות על דיווחים דחופים</strong>
                                <span>קבלת עדכון כאשר נפתח צורך דחוף באזור הפעילות.</span>
                            </div>
                            <input type="checkbox" id="notifyUrgent" class="setting-toggle" checked>
                        </div>
                        <div class="setting-item">
                            <div>
                                <strong>סיכום שבועי</strong>
                                <span>דוח קצר על משימות, דיווחים וסטטוסים פתוחים.</span>
                            </div>
                            <input type="checkbox" id="notifyWeekly" class="setting-toggle" checked>
                        </div>
                    </div>
                </section>
            </section>
        </main>
    </div>

    <script src="sidebar.js"></script>
    <script src="help-tooltips.js"></script>
    <script>
        let loadedProfile = null;

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function firstLetter(name) {
            const clean = String(name || '').trim();
            return clean ? clean.slice(0, 1) : 'מ';
        }

        function showProfileMessage(message, type = 'success') {
            const box = document.getElementById('profileMessage');
            box.textContent = message;
            box.className = `profile-message active ${type}`;
        }

        function clearProfileMessage() {
            const box = document.getElementById('profileMessage');
            box.className = 'profile-message';
            box.textContent = '';
        }

        function applyProfile(profile) {
            loadedProfile = profile;
            const name = profile.full_name || 'משתמש';
            document.getElementById('profileAvatar').textContent = firstLetter(name);
            document.getElementById('profileName').textContent = name;
            document.getElementById('profileRolePill').textContent = profile.role_display || '-';
            document.getElementById('profileRole').textContent = profile.role_display || '-';
            document.getElementById('profileAreaSummary').textContent = profile.area || '-';
            document.getElementById('profileOrg').textContent = profile.organization_id ? `#${profile.organization_id}` : '-';

            document.getElementById('fullName').value = profile.full_name || '';
            document.getElementById('phone').value = profile.phone || '';
            document.getElementById('email').value = profile.email || '';
            document.getElementById('area').value = profile.area || '';
            document.getElementById('roleReadonly').textContent = profile.role_display || '-';
            document.getElementById('organizationReadonly').textContent = profile.organization_id ? `עמותה #${profile.organization_id}` : 'לא משויך';
            document.getElementById('notifyUrgent').checked = Boolean(profile.notifications?.urgent_reports);
            document.getElementById('notifyWeekly').checked = Boolean(profile.notifications?.weekly_summary);

            const passwordSupported = Boolean(profile.supports_password_change);
            document.getElementById('oldPassword').disabled = !passwordSupported;
            document.getElementById('newPassword').disabled = !passwordSupported;
            document.getElementById('oldPassword').placeholder = passwordSupported ? '' : 'לא נתמך במערכת הנוכחית';
            document.getElementById('newPassword').placeholder = passwordSupported ? 'לפחות 8 תווים' : 'לא נתמך במערכת הנוכחית';
        }

        async function loadProfile() {
            clearProfileMessage();

            try {
                const response = await fetch('./api/profile.php', { cache: 'no-store' });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'profile load failed');
                }

                applyProfile(data.profile);
            } catch (error) {
                console.error('PROFILE LOAD ERROR:', error);
                showProfileMessage('לא הצלחנו לטעון את הפרופיל כרגע.', 'error');
            }
        }

        async function saveProfile(event) {
            event.preventDefault();
            clearProfileMessage();

            const payload = {
                full_name: document.getElementById('fullName').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                email: document.getElementById('email').value.trim(),
                area: document.getElementById('area').value.trim(),
                notifications: {
                    urgent_reports: document.getElementById('notifyUrgent').checked,
                    weekly_summary: document.getElementById('notifyWeekly').checked
                }
            };

            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;

            if (newPassword) {
                payload.old_password = oldPassword;
                payload.new_password = newPassword;
            }

            try {
                const response = await fetch('./api/profile.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.message || 'profile save failed');
                }

                document.getElementById('oldPassword').value = '';
                document.getElementById('newPassword').value = '';
                applyProfile(data.profile);
                showProfileMessage(data.message || 'הפרופיל עודכן בהצלחה.', 'success');
            } catch (error) {
                console.error('PROFILE SAVE ERROR:', error);
                showProfileMessage(error.message || 'לא הצלחנו לשמור את הפרופיל.', 'error');
            }
        }

        document.getElementById('profileForm').addEventListener('submit', saveProfile);
        loadProfile();
    </script>
</body>
</html>
