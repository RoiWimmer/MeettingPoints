<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>נקודות חיבור - דוחות</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="help-tooltips.css">
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Heebo:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar" data-sidebar></aside>

        <main class="main-content">
            <header class="top-bar">
                <div>
                    <h1 class="title-with-help">
                        דיווחים
                        <button type="button" class="help-icon" data-tooltip="כאן ניתן לראות את כל הפניות שנשלחו למערכת ולעקוב אחר הטיפול בהן." aria-label="מידע נוסף">?</button>
                    </h1>
                    <p class="page-explanation">כאן ניתן לנהל את הדיווחים שהתקבלו, לעקוב אחרי סטטוס הטיפול ולראות פרטים חשובים על כל מקרה.</p>
                </div>
                <a href="index.html" style="text-decoration:none; color:var(--primary-orange)">חזרה לבית</a>
            </header>

            <div class="reports-filter">
                <div class="filter-item"><label>שם קשיש</label><input type="text" placeholder="חיפוש..."></div>
                <div class="filter-item">
                    <div class="label-with-help">
                        <label>סטטוס</label>
                        <button type="button" class="help-icon" data-tooltip="הסטטוס מציג באיזה שלב הטיפול נמצא: חדש, בטיפול או טופל." aria-label="מידע נוסף">?</button>
                    </div>
                    <select>
                        <option>הכל</option>
                        <option>פתוח</option>
                        <option>בטיפול</option>
                        <option>טופל</option>
                    </select>
                </div>
                <button style="background:var(--primary-orange); color:white; border:none; padding:10px 20px; border-radius:10px; cursor:pointer;">חפש</button>
                <button type="button" class="help-icon" data-tooltip="הסינון עוזר למצוא במהירות דיווחים לפי שם או סטטוס טיפול." aria-label="מידע נוסף">?</button>
            </div>

            <div class="report-list">
                <div class="report-row"><span>אברהם כהן</span><strong>בטיפול</strong></div>
                <div class="report-row"><span>שרה לוי</span><strong>טופל</strong></div>
            </div>
        </main>
    </div>
    <script src="sidebar.js"></script>
    <script src="help-tooltips.js"></script>
</body>
</html>
